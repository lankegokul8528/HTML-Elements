<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tables and forms</title>
    </head>
    <body>
        <h1>Tables</h1>
        <table border="1">
            <caption>Student Records</caption>
            <thead>
            <tr>
                <th>Roll no</th>
                <th>Name</th>
                <th>Course</th>
                <th>Grade</th>
                <th>Image</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>2500030287</td>
                <td>John Doe</td>
                <td>Computer Science</td>
                <td>A</td>
                <td><img src="john.jpg" alt="John Doe, Computer Science student with grade A"></td>
            </tr>
        
            <tr>
                <td>2500030288</td>
                <td>Jane Smith</td>
                <td>Mathematics</td>
                <td>B</td>
                <td><img src="jane.jpg" alt="Jane Smith, Mathematics student with grade B"></td>
            </tr>
            <tr>
                <td>2500030289</td>
                <td>Bob Johnson</td>
                <td>Physics</td>
                <td>A</td>
                <td><img src="bob.jpg" alt="Bob Johnson, Physics student with grade A"></td>
            </tr>
            <tr>
                <td>2500030290</td>
                <td>Alice Brown</td>
                <td>Chemistry</td>
                <td>A</td>
                <td><img src="alice.jpg" alt="Alice Brown, Chemistry student with grade A"></td>
            </tr>
            </tbody>
        </table>

    </body>
</html>
